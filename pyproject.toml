[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-pbx"
description = "Agent PBX MCP service for agent status reporting and follow-up queues."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Agent PBX contributors"}]
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
    "mcp[cli]>=1.8,<2",
    "pydantic>=2.7,<3",
    "textual>=0.58,<1",
    "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
images = [
    "Pillow>=10,<12",
]
dev = [
    "build>=1,<2",
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
]

[project.scripts]
agent-pbx = "agent_pbx.cli:main"

[tool.setuptools.dynamic]
version = {attr = "agent_pbx.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
