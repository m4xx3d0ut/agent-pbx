name: publish Agent PBX to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testpypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Require manual dispatch from an immutable prerelease tag
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$RELEASE_REF_TYPE" != "tag" ]]; then
            echo "Select a vMAJOR.MINOR.PATCHrcN tag in the Run workflow ref selector." >&2
            exit 1
          fi
          echo "TestPyPI candidate: $RELEASE_REF_NAME"

  quality:
    needs: validate-ref
    uses: ./.github/workflows/release-quality.yml
    with:
      tag: ${{ github.ref_name }}
      channel: testpypi
      index-json-url: https://test.pypi.org/pypi/agent-pbx/json
    permissions:
      contents: read

  publish-testpypi:
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/agent-pbx/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the exact tested distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: release-artifact
      - name: Publish distributions to TestPyPI with OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release-artifact/packages/
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  verify-testpypi:
    needs: [quality, publish-testpypi]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Download the published distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: release-artifact
      - name: Verify TestPyPI hashes and clean installation
        run: >-
          python scripts/verify_pypi_release.py
          --project agent-pbx
          --version "${{ needs.quality.outputs.version }}"
          --dist release-artifact/packages
          --index-json-base https://test.pypi.org/pypi
          --simple-index-url https://test.pypi.org/simple
          --extra-index-url https://pypi.org/simple
