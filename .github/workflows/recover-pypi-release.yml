name: recover Agent PBX PyPI verification and GitHub assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable stable tag to verify and recover
        required: true
        type: string
      source_run_id:
        description: Original publish-pypi workflow run containing the exact artifacts
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: recover-pypi-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate-recovery:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the exact recovery tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Validate stable tag, commit, version, and release documents
        id: release
        run: >-
          python scripts/validate_release.py metadata
          --tag "${{ inputs.tag }}"
          --channel production
          --branch origin/dev
      - name: Bind the source workflow run to the exact tag
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_TAG: ${{ inputs.tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          tag_commit="$(git rev-parse "${RECOVERY_TAG}^{commit}")"
          source_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq .head_sha)"
          source_event="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq .event)"
          source_path="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq .path)"
          if [[ "$source_sha" != "$tag_commit" ]]; then
            echo "Source run commit $source_sha does not match tag commit $tag_commit." >&2
            exit 1
          fi
          if [[ "$source_event" != "release" ]]; then
            echo "Source run event must be release, found $source_event." >&2
            exit 1
          fi
          if [[ "$source_path" != ".github/workflows/publish-pypi.yml" ]]; then
            echo "Source run must use publish-pypi.yml, found $source_path." >&2
            exit 1
          fi

  verify-pypi:
    needs: validate-recovery
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact recovery tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Download the original published distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: release-artifact
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
      - name: Verify PyPI hashes and clean installation
        run: >-
          python scripts/verify_pypi_release.py
          --project agent-pbx
          --version "${{ needs.validate-recovery.outputs.version }}"
          --dist release-artifact/packages

  verify-github-assets:
    needs: validate-recovery
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact recovery tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Download the original GitHub release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-release-assets
          path: release-assets
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
      - name: Verify wheelhouse checksum, manifest, and installer identity
        run: |
          (cd release-assets && sha256sum --check agent-pbx-wheelhouse.tar.gz.sha256)
          cmp scripts/install-agent-pbx.sh release-assets/install-agent-pbx.sh
          mkdir recovered-wheelhouse
          tar -xzf release-assets/agent-pbx-wheelhouse.tar.gz -C recovered-wheelhouse
          python scripts/release_manifest.py verify \
            --wheelhouse recovered-wheelhouse/agent-pbx-wheelhouse

  restore-github-assets:
    needs: [validate-recovery, verify-pypi, verify-github-assets]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download the verified original GitHub release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-release-assets
          path: release-assets
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
      - name: Require the existing stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --silent
      - name: Restore exact GitHub release assets idempotently
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          gh release upload "$RELEASE_TAG"
          --repo "$GITHUB_REPOSITORY"
          release-assets/agent-pbx-wheelhouse.tar.gz
          release-assets/agent-pbx-wheelhouse.tar.gz.sha256
          release-assets/install-agent-pbx.sh
          --clobber
